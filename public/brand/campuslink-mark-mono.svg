<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CampusLink">
  <!-- Single-color version for one-color-only contexts (print, stamps,
       Safari's pinned-tab mask-icon - which requires pure black shapes
       on a transparent ground; the browser then tints it via the
       link tag's `color` attribute). -->
  <circle cx="16" cy="32" r="9" fill="#000"/>
  <circle cx="48" cy="32" r="9" fill="none" stroke="#000" stroke-width="5"/>
  <path d="M25 32 L 39 32" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7.5"/>
</svg>
