<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CampusLink">
  <!-- The relay dot: filled = has the item, hollow = waiting for it,
       dashed line = distance between them. For light backgrounds
       (light-mode header, light UI surfaces). -->
