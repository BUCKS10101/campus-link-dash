<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CampusLink">
  <!-- Full-bleed square, for app/PWA icon contexts where the OS applies
       its own corner/circle mask on top - unrounded so that mask doesn't
       clip a visible rounded corner of its own. Mark sits with generous
       margin (dots span x=7-57, y=23-41 of the 64x64 canvas), safely
       inside any circular or squircle mask crop. -->
  <rect width="64" height="64" fill="#7a3b5e"/>
  <circle cx="16" cy="32" r="9" fill="#faf3ee"/>
  <circle cx="48" cy="32" r="9" fill="none" stroke="#c2902f" stroke-width="5"/>
  <path d="M25 32 L 39 32" stroke="#faf3ee" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7.5" opacity=".7"/>
</svg>
